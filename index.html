<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Know Your Type · 사상체질 테스트">
<meta property="og:description" content="20문항으로 알아보는 나의 사상체질과 맞춤 음식·생활 팁">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Know Your Type 사상체질 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 모바일 한 열(최대 440px). 시작 → 성별 → 20문항 → 결과 (한국어/영어). 매트 그레이·차콜 패키지 톤, 체질 색은 라벨로만. 라이트 단일 테마. */
:root{
  --page:#bdbdbb; --paper:#d3d3d1; --char:#3b3b3d; --deep:#2a2a2b; --ink:#1c1c1d; --muted:#5f5f61; --line:#bcbcba; --light:#f2f2f0;
  --tae-yang:#3f6db0; --so-yang:#a3307a; --tae-eum:#6ea14a; --so-eum:#c0652a;
  --c:var(--so-eum);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--page);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;margin:0;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.12)}
.en{font-family:Inter,sans-serif;font-weight:900;letter-spacing:-1.5px;line-height:.95}
.kick{font-family:Inter,sans-serif;font-size:10px;letter-spacing:2.5px;font-weight:500;color:#a6a6a8}
.gut{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--c);outline-offset:2px}

/* 시작 */
.start-hero{background:linear-gradient(160deg,#4a4a4c,#2e2e30);color:var(--light);padding-block:52px 34px;position:relative;overflow:hidden}
.langbtn{position:absolute;top:18px;right:max(24px,env(safe-area-inset-right,0px));background:transparent;border:1px solid #6a6a6c;color:var(--light);font-size:12px;font-weight:700;padding:6px 10px;font-family:Inter,"Noto Sans KR",sans-serif}
.start-hero .big{font-size:64px;margin-top:16px}
.labels{display:flex;gap:8px;margin-top:30px;flex-wrap:wrap}
.lb{border:2px solid #141415;color:#141415;padding:8px 9px 6px;width:calc(25% - 6px);min-width:70px;box-shadow:4px 5px 0 rgba(0,0,0,.3)}
.lb:nth-child(odd){transform:rotate(-5deg)}.lb:nth-child(even){transform:rotate(4deg) translateY(6px)}
.lb b{display:block;font-family:Inter,sans-serif;font-weight:900;font-size:10px}
.lb span{display:block;font-size:13px;font-weight:900;margin-top:10px;border-top:1.5px solid #141415;padding-top:4px}
.start-body{padding-block:30px 32px;display:flex;flex-direction:column;flex:1}
.start-body h1{font-size:28px;font-weight:900;letter-spacing:-1px;margin:0}
.h1sub{font-size:14px;color:var(--muted);margin-top:4px;font-style:italic}
.start-body p{font-size:14px;color:var(--muted);line-height:1.65;margin:8px 0 0}
.facts{display:flex;gap:18px;margin-top:22px;font-size:12px;color:var(--muted)}
.facts b{display:block;font-family:Inter,sans-serif;font-size:20px;color:var(--ink);font-weight:900}
.cta{margin-top:auto;height:56px;width:100%;border:0;background:var(--char);color:var(--light);font-size:16px;font-weight:700}
.cta:hover{background:var(--deep)}
.note{font-size:11px;color:var(--muted);text-align:center;margin:12px 0 0;line-height:1.5}

/* 질문 */
.quiz{padding-block:22px 32px;display:flex;flex-direction:column;flex:1}
.top{display:flex;align-items:center;justify-content:space-between;height:36px}
.back{border:0;background:none;font-size:14px;color:var(--muted);padding:6px 0}
.back[disabled]{visibility:hidden}
.gdesc{font-size:14px;color:var(--muted);line-height:1.6;margin:10px 0 0}
.flabel{display:block;font-size:15px;font-weight:700;margin-top:26px}
.finput{width:100%;margin-top:10px;height:50px;padding:0 16px;font:inherit;font-size:15px;border:2px solid transparent;background:#e3e3e1;color:var(--ink)}
.finput:focus{outline:none;border-color:var(--char)}
.dxs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dx{padding:10px 12px;font-size:14px;border:1.5px solid #a9a9a7;background:transparent;color:var(--ink)}
.dx.on{background:var(--char);color:var(--light);border-color:var(--char)}
.rnote{font-size:12px;color:#a6a6a8;line-height:1.5;margin:10px 0 0}
.alsop{font-size:13px;color:var(--muted);line-height:1.6;margin:-6px 0 12px}
.wt{font-size:17px;font-weight:900;margin-bottom:12px;letter-spacing:-.4px}
.whys{display:flex;flex-direction:column;gap:10px}
.why{background:#e3e3e1;padding:14px 16px;font-size:14px;line-height:1.6}
.why b{font-weight:700;display:block}
.why em{font-style:normal;font-family:Inter,sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--muted);display:block;margin-bottom:2px}
.why span{display:block;margin-top:4px;color:var(--muted)}
.code{margin-top:18px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:11px;color:#a6a6a8}
.code code{font-family:Inter,monospace;color:var(--light);word-break:break-all;flex:1;min-width:0}
.code button{background:none;border:1px solid #6a6a6c;color:#c9c9c7;font-size:11px;padding:5px 8px}
.count{font-family:Inter,sans-serif;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:#bcbcba;margin-top:10px}
.bar i{display:block;height:100%;background:var(--char);transition:width .3s}
.cat{margin-top:34px;display:inline-block;align-self:flex-start;font-family:Inter,"Noto Sans KR",sans-serif;font-size:11px;font-weight:900;letter-spacing:1px;background:var(--char);color:var(--light);padding:4px 8px}
.q{font-size:24px;font-weight:900;line-height:1.4;letter-spacing:-.7px;margin:14px 0 0;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:28px}
.opt{text-align:left;padding:17px 18px;font-size:15px;line-height:1.45;background:#e3e3e1;border:2px solid transparent;color:var(--ink);font-weight:500}
.opt:hover{border-color:#8f8f8d}
.opt.on{background:var(--char);color:var(--light);border-color:var(--char)}

/* 결과 */
.hero{padding-block:44px 30px;background:linear-gradient(160deg,#4a4a4c,#2e2e30);color:var(--light)}
.label{margin:26px 0 24px 6px;width:220px;max-width:70%;border:2.5px solid #141415;padding:12px 14px 10px;transform:rotate(-6deg);color:#141415;background:var(--c);box-shadow:8px 10px 0 rgba(0,0,0,.25)}
.label .en{font-size:36px}
.label .line{border-top:1.5px solid #141415;margin-top:8px;padding-top:5px;font-family:Inter,sans-serif;font-size:10px;font-weight:700}
.label .step{font-family:Inter,sans-serif;font-weight:900;font-size:16px;margin-top:6px}
.name{font-size:28px;line-height:1.25;font-weight:900;letter-spacing:-1px;margin:0}
.nick{font-size:15px;color:#c9c9c7;margin-top:2px}
.mix{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;font-weight:500;color:var(--light);border:1px solid #6a6a6c;padding:6px 10px}
.mix i{width:10px;height:10px;outline:1px solid #141415}
.sec{padding-block:24px;border-top:1.5px solid var(--line)}
.sec h3{font-family:Inter,sans-serif;font-size:11px;letter-spacing:2px;font-weight:700;color:var(--muted);margin:0 0 12px}
.bars{display:flex;flex-direction:column;gap:10px}
.row span{white-space:nowrap}
.row{display:grid;grid-template-columns:64px 1fr 40px;align-items:center;gap:10px;font-size:13px;font-variant-numeric:tabular-nums}
.track{height:9px;background:#bdbdbb}
.track i{display:block;height:100%;width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.row b{text-align:right;font-family:Inter,sans-serif}
.row.me{font-weight:700}
ul{list-style:none;display:flex;flex-direction:column;gap:9px;font-size:14.5px;line-height:1.6;margin:0;padding:0}
li{padding-left:15px;position:relative}
li::before{content:"";position:absolute;left:0;top:.66em;width:6px;height:6px;background:var(--c);outline:1px solid #141415}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:6px 10px;background:var(--char);color:var(--light)}
.chip.no{background:transparent;color:var(--muted);border:1.5px solid #a9a9a7;text-decoration:line-through;text-decoration-color:#8f8f8d}
.sub{font-size:12px;font-weight:700;margin:16px 0 8px}
.sub.first{margin-top:0}
.btns{padding-block:24px 34px;display:flex;flex-direction:column;gap:8px;background:var(--char)}
.btn{height:52px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;width:100%}
.btn.p{background:var(--c);color:#141415;border:2px solid #141415}
.btn.s{background:transparent;border:1.5px solid #8a8a8c;color:var(--light)}
.btns .note{color:#a6a6a8}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--light);padding:12px 18px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:no-preference){
  .screen{animation:in .35s ease both}
  @keyframes in{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
  .opt{transition:background .15s,color .15s,border-color .15s}
}
</style>
</head>
<body>

<div class="app" id="app"></div>
<div class="toast" id="toast" role="status"></div>

<script>
const TYPES={
 TY:{ko:"태양인",en:"Tae-yang",n:1,color:"var(--tae-yang)",nick:"거침없는 개척자",
  traits:["남들이 안 가본 길을 먼저 여는 진취형이에요","결단이 빠르고 목표가 분명해요","마음이 급해지면 독단적으로 보일 수 있어요"],
  good:["메밀","새우","조개","오이","포도","모과차"],bad:["기름진 고기","매운 음식","튀김"],
  tips:["소변이 시원하게 잘 나올 때 몸이 가볍고 컨디션이 좋아요","기름지고 매운 음식보다 담백하고 시원한 음식이 잘 맞아요","하체가 쉽게 피로해지니 걷기·스쿼트로 하체를 챙기세요","화가 날 땐 한 템포 쉬고 결정하기"]},
 SY:{ko:"소양인",en:"So-yang",n:2,color:"var(--so-yang)",nick:"불꽃 같은 추진러",
  traits:["솔직하고 시원시원해서 분위기를 띄워요","생각나면 바로 행동하는 빠른 실행력","시작은 잘하지만 마무리가 약할 때가 있어요"],
  good:["보리","돼지고기","오이","배추","굴","수박"],bad:["고추","닭고기","꿀","인삼"],
  tips:["화장실을 시원하게 가는 날이 컨디션 좋은 날이에요","맵고 뜨거운 음식, 과음은 줄이기","식사를 너무 빨리 하지 않도록 천천히","일을 벌이기 전에 끝낼 것 하나부터 정리하기"]},
 TE:{ko:"태음인",en:"Tae-eum",n:3,color:"var(--tae-eum)",nick:"든든한 거목",
  traits:["한번 시작하면 끝까지 해내는 끈기가 있어요","속이 깊고 듬직해서 믿음직해요","변화가 귀찮아 미루기도 해요"],
  good:["소고기","두부","고구마","무","도라지","버섯"],bad:["닭고기","돼지고기","꿀","인삼"],
  tips:["땀을 흘리고 나면 개운해요. 땀이 나는 유산소 운동이 잘 맞아요","식욕이 좋아 살이 붙기 쉬우니 과식·야식 주의","미루던 일 하나만 오늘 끝내 보기"]},
 SE:{ko:"소음인",en:"So-eum",n:4,color:"var(--so-eum)",nick:"섬세한 전략가",
  traits:["꼼꼼하고 신중해서 실수가 적어요","겉은 조용해도 생각이 깊고 계획적이에요","걱정이 많아지면 기운이 쉽게 빠져요"],
  good:["찹쌀","닭고기","감자","양배추","생강차"],bad:["보리","돼지고기","참외","냉면"],
  tips:["소화가 잘될 때 컨디션이 가장 좋아요. 따뜻한 음식을 천천히 드세요","땀을 많이 빼는 운동보다 걷기·요가처럼 가볍게","혼자 고민을 키우지 말고 한 번씩 털어놓기"]}
};
const ORDER=["TY","SY","TE","SE"];
const Q=[
 {cat:"성격",q:"처음 만난 사람들과 있을 때 나는?",a:[["분위기를 내가 이끈다","SY"],["먼저 말 걸고 금방 친해진다","SY"],["듣다가 천천히 친해진다",{TE:1,SE:1}],["낯을 가려 조용한 편이다",{TE:1,SE:1}]]},
 {cat:"성격",q:"일이 갑자기 몰려오면?",a:[["큰 방향만 잡고 과감하게 밀어붙인다","TY"],["일단 바로 뛰어들어 빠르게 처리한다","SY"],["묵묵히 끝까지 버티며 해낸다","TE"],["계획부터 세우고 하나씩 꼼꼼히 한다","SE"]]},
 {cat:"성격",q:"친구들이 보는 나는?",a:[["추진력 있고 고집 있는 사람","TY"],["솔직하고 시원시원한 사람","SY"],["듬직한데 속을 잘 모르겠는 사람","TE"],["섬세하고 배려 깊은 사람","SE"]]},
 {cat:"성격",q:"스트레스를 받으면 몸이 어떻게 반응하나요?",a:[["음식이 목에 걸린 듯 잘 안 넘어간다","TY"],["가슴이 답답하고 얼굴로 열이 확 오른다","SY"],["가슴이 두근거리고 식은땀이 난다","TE"],["입맛이 없어지고 소화가 안 되거나 체한다","SE"]]},
 {cat:"성격",q:"새로운 일 앞에서 나는?",a:[["남들이 안 해본 방식을 시도한다","TY"],["일단 저지르고 본다","SY"],["익숙한 방식이 편하다","TE"],["충분히 알아보고 신중하게 시작한다","SE"]]},
 {cat:"몸·생활",q:"아이스 음료·냉면·수박처럼 찬 음식을 먹고 나면?",a:[["조금만 먹어도 배가 아프거나 설사를 해서, 일부러 피하게 된다","SE"],["속이 시원하고 오히려 편하다","SY"],["별 탈 없이 잘 먹는다","TE"]]},
 {cat:"몸·생활",q:"컨디션이 좋을 때는 언제인가요?",a:[["소변이 시원하게 잘 나올 때","TY"],["화장실을 매일 시원하게 갈 때","SY"],["땀을 쭉 흘리고 난 뒤","TE"],["소화가 잘될 때 (반대로 체하면 하루 종일 기운이 없다)","SE"]]},
 {cat:"몸·생활",q:"땀을 흘리고 나면?",a:[["개운하고 몸이 가볍다","TE"],["금방 지치고 기운이 빠진다","SE"],["별 차이 없다",{SY:.5,TY:.5}]]},
 {cat:"몸·생활",q:"나의 식사 습관은?",a:[["담백하게, 가볍게 먹는 게 편하다","TY"],["빨리 먹는 편이다","SY"],["잘 먹고 살이 잘 찐다","TE"],["적게 먹고 소화가 예민하다","SE"]]},
 {cat:"몸·생활",q:"물을 마실 때 나는?",a:[["시원한 물이 좋고, 한 번에 많이 마시는 편이다","SY"],["물을 많이, 자주 마신다","TE"],["따뜻한 물을 조금씩 마신다","SE"]]},
 {cat:"몸·생활",q:"내 체형에 가까운 건?",a:[["가슴·어깨가 넓고 엉덩이가 작은 편","SY"],["허리·배 쪽이 발달하고 체격이 큰 편","TE"],["하체가 발달하고 상체가 작고 마른 편","SE"]]},
 {cat:"몸·생활",q:"원래부터 약하다고 느끼는 곳은?",a:[["허리·다리 힘이 약해 오래 걷거나 서 있기 힘들다","TY"],["허리가 약하고, 피곤하면 소변이 잦거나 시원치 않다","SY"],["목·기관지가 약해 감기 오면 기침부터 하고, 피부도 잘 건조해진다","TE"],["어릴 때부터 위장이 약해서, 조금만 과식해도 잘 체한다","SE"]]},
 {cat:"몸·생활",q:"컨디션이 안 좋을 때 화장실은?",a:[["소변 양이 줄고 색이 진해진다","TY"],["변비가 잘 생기고 속이 답답하다","SY"],["배에 가스가 차고 묽은 변을 자주 본다","TE"],["아랫배가 차고 변을 봐도 시원하지 않다","SE"]]},

 ko:{langBtn:"EN",h1:"나는 어떤 체질일까?",sub:"성격과 몸의 작은 신호로 알아보는 나의 사상체질, 그리고 나에게 맞는 음식과 생활 팁까지.",fq:"문항",fm:"분",ft:"체질",cta:"테스트 시작하기",note:"한의표준임상진료지침을 참고한 간이 테스트예요.<br>정확한 체질 진단은 한의사 진료가 필요해요.",home:"← 처음으로",prev:"← 이전",dxl:"한의원에서 진단받은 체질이 있다면?",dxna:"모름",dxnote:"답변은 테스트 개선에만 사용돼요.",gq:"성별을 선택해 주세요",gd:"남녀는 타고난 체형이 달라서, 체질을 더 정확하게 계산하는 데 사용돼요.",F:"여성",M:"남성",catP:"성격",catB:"몸·생활",
  title:n=>`나는 ${n}에<br>가장 가까워요`,rnote:"(20문항 응답을 바탕으로 한 결과예요. 한의사의 자세한 진단에 따라 달라질 수 있어요.)",whyT:n=>`왜 ${n}에 가까울까요?`,my:"내 답",good:"잘 맞는 음식",bad:"줄이면 좋은 음식",alsoT:n=>`${n}일 가능성도 있어요`,alsoP:(n,p)=>`${n} 쪽 응답도 ${p}% 있었어요.`,alsoEnd:"두 체질의 특징이 섞여 있다면, 한의사 진료로 정확히 확인해 보세요.",share:"결과 공유하기",again:"다시 테스트하기",rfoot:"한의표준임상진료지침을 참고한 재미·참고용 테스트예요.<br>정확한 체질은 한의사 진료로 확인해주세요.",code:"응답 코드",copy:"코드 복사",copied:"코드를 복사했어요",hold:"코드를 길게 눌러 복사해 주세요",shareText:(n,k)=>`나는 ${n} · ${k}! 너는 어떤 체질이야?`,shareTitle:"사상체질 테스트",linkCopied:"링크를 복사했어요",linkFail:"주소창의 링크를 복사해 공유해 주세요"},
 en:{langBtn:"한국어",h1:"What's your Sasang type?",sub:"Find your Sasang constitution through small signals from your personality and body — plus the foods and daily tips that suit you.",fq:"questions",fm:"min",ft:"types",cta:"Start the test",note:"A simple test based on Korea's clinical practice guideline for Sasang constitutional medicine.<br>For an accurate diagnosis, see a Korean medicine doctor.",home:"← Home",prev:"← Back",gq:"Select your sex",gd:"Body shape differs by sex, so this helps us calculate your type more accurately.",F:"Female",M:"Male",catP:"Personality",catB:"Body & Lifestyle",
  title:n=>`You're closest to<br>${n}`,rnote:"(Based on your 20 answers. A detailed diagnosis by a Korean medicine doctor may differ.)",whyT:n=>`Why ${n}?`,my:"YOUR ANSWER",good:"Foods that suit you",bad:"Foods to cut back on",alsoT:n=>`You might also be ${n}`,alsoP:(n,p)=>`${p}% of your answers pointed to ${n}.`,alsoEnd:"If you have traits of both, a Korean medicine doctor can confirm your type.",share:"Share my result",again:"Take it again",rfoot:"A fun, reference-only test based on Korea's clinical practice guideline for Sasang constitutional medicine.<br>Please confirm your type with a Korean medicine doctor.",code:"Response code",copy:"Copy",copied:"Code copied",hold:"Press and hold to copy the code",shareText:(n,k)=>`I'm closest to ${n} · ${k}! What's your type?`,shareTitle:"Sasang Type Test",linkCopied:"Link copied",linkFail:"Copy the link from the address bar to share"}

let lang=(()=>{const h=(location.hash||"").toLowerCase();if(h==="#en")return "en";if(h==="#ko")return "ko";try{return (navigator.language||"ko").toLowerCase().startsWith("ko")?"ko":"en";}catch(e){return "ko";}})();
const u=k=>UI[lang][k];
const T=k=>lang==="en"?{...TYPES[k],...EN.types[k]}:TYPES[k];
const qText=i=>lang==="en"?EN.q[i][0]:Q[i].q;
const aText=(i,j)=>lang==="en"?EN.q[i][1][j]:Q[i].a[j][0];
const catText=i=>Q[i].cat==="성격"?u("catP"):u("catB");

function whyList(top,max=3){
  const out=[];
  for(const qt of WHY_ORDER){
    const qi=Q.findIndex(x=>x.q===qt); if(qi<0||answers[qi]==null) continue;
    const ai=answers[qi], v=Q[qi].a[ai][1];
    const hit=typeof v==="string"?v===top:(v[top]||0)>=1;
    const ex=lang==="en"?(EN.why[qi]||[])[ai]:(WHY[qt]||[])[ai];
    if(hit&&ex) out.push({ans:aText(qi,ai),ex});
    if(out.length>=max) break;
  }
  return out;
}
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function start(){
  document.documentElement.lang=lang;
  document.documentElement.style.setProperty("--c","var(--so-eum)");
  app.innerHTML=`<div class="screen" style="display:flex;flex-direction:column;flex:1">
   <div class="start-hero gut"><button class="langbtn" id="lang">${u("langBtn")}</button><div class="kick">SASANG TYPE TEST</div><div class="en big">Know<br>Your<br>Type.</div>
    <div class="labels">${ORDER.map(k=>`<div class="lb" style="background:${TYPES[k].color}"><b>#TYPE.${TYPES[k].n}</b><span>${T(k).ko}</span></div>`).join("")}</div></div>
   <div class="start-body gut"><h1>${u("h1")}</h1>${lang==="en"?`<div class="h1sub">(Korean body constitution)</div>`:""}<p>${u("sub")}</p>
    <div class="facts"><div><b>20</b>${u("fq")}</div><div><b>3</b>${u("fm")}</div><div><b>4</b>${u("ft")}</div></div>
    <div style="flex:1;min-height:28px"></div>
    <button class="cta" id="go">${u("cta")}</button><p class="note">${u("note")}</p></div></div>`;
  document.getElementById("go").onclick=()=>{answers=[];idx=0;genderScreen();};
  document.getElementById("lang").onclick=()=>{lang=lang==="ko"?"en":"ko";if(lang==="en")dx="";start();};
}

function genderScreen(){
  const dxBlock=lang==="ko"?`<div class="flabel">${u("dxl")}</div>
   <div class="dxs">${[["TY","태양인"],["SY","소양인"],["TE","태음인"],["SE","소음인"],["NA",u("dxna")]].map(([k,l])=>`<button class="dx ${dx===k?"on":""}" data-k="${k}">${l}</button>`).join("")}</div>
   <p class="gdesc">${u("dxnote")}</p>`:"";
  app.innerHTML=`<div class="screen quiz gut">
   <div class="top"><button class="back" id="back">${u("home")}</button><span class="count"></span></div>
   ${dxBlock}
   <h2 class="q" style="margin-top:${lang==="ko"?34:40}px">${u("gq")}</h2>
   <p class="gdesc">${u("gd")}</p>
   <div class="opts"><button class="opt g ${gender==="F"?"on":""}" data-g="F">${u("F")}</button><button class="opt g ${gender==="M"?"on":""}" data-g="M">${u("M")}</button></div></div>`;
  document.getElementById("back").onclick=()=>{window.scrollTo(0,0);start();};
  app.querySelectorAll(".dx").forEach(b=>b.onclick=()=>{dx=b.dataset.k;app.querySelectorAll(".dx").forEach(x=>x.classList.toggle("on",x===b));});
  app.querySelectorAll(".opt.g").forEach(b=>b.onclick=()=>{
    gender=b.dataset.g;
    app.querySelectorAll(".opt.g").forEach(x=>x.classList.toggle("on",x===b));
    setTimeout(()=>{idx=0;question();},260);
  });
}

function question(){
  const item=Q[idx];
  app.innerHTML=`<div class="screen quiz gut">
   <div class="top"><button class="back" id="back">${u("prev")}</button><span class="count">${idx+1} / ${Q.length}</span></div>
   <div class="bar"><i style="width:${(idx)/Q.length*100}%"></i></div>
   <span class="cat">${catText(idx)}</span><h2 class="q">${esc(qText(idx))}</h2>
   <div class="opts">${item.a.map((o,i)=>`<button class="opt ${answers[idx]===i?"on":""}" data-i="${i}">${esc(aText(idx,i))}</button>`).join("")}</div></div>`;
  requestAnimationFrame(()=>{const b=app.querySelector(".bar i");if(b)b.style.width=((idx+1)/Q.length*100)+"%";});
  document.getElementById("back").onclick=()=>{if(idx>0){idx--;question();}else{genderScreen();}};
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    answers[idx]=+b.dataset.i;
    app.querySelectorAll(".opt").forEach(x=>x.classList.toggle("on",x===b));
    setTimeout(()=>{if(idx<Q.length-1){idx++;question();}else result();},260);
  });
}

// 1.5배 가산점 문항
const KEY_Q=["홍삼이나 인삼을 먹으면?"];
// 여성이면 체질과 상관없이 흔한 특징이라 소음 점수를 절반만 반영하는 문항
const FEM_Q=["물을 마실 때 나는?","내 체형에 가까운 건?","평소 내 몸은 어느 쪽에 가까운가요?","내 체중은 보통 어떤 편인가요?","상의·하의 사이즈를 떠올리면, 내 몸은?","배가 많이 고플 때 나는?","운동할 때 내 몸은?"];
// 동점 때 기준이 되는 체형 문항
const SHAPE_Q=["내 체형에 가까운 건?","상의·하의 사이즈를 떠올리면, 내 몸은?"];
function score(){
  const s={TY:0,SY:0,TE:0,SE:0}, shape={TY:0,SY:0,TE:0,SE:0};
  answers.forEach((ai,qi)=>{const item=Q[qi],v=item.a[ai][1],w=KEY_Q.includes(item.q)?1.5:1;
    const add=(k,x)=>{s[k]+=x*w*((gender==="F"&&k==="SE"&&FEM_Q.includes(item.q))?.5:1);if(SHAPE_Q.includes(item.q))shape[k]+=x;};
    if(typeof v==="string")add(v,1);else for(const k in v)add(k,v[k]);});
  s.TY*=0.8; // 태양인은 실제로 매우 드물어 가중치를 낮춤
  const total=Object.values(s).reduce((a,b)=>a+b,0)||1;
  const ranked=ORDER.slice().sort((a,b)=>(s[b]-s[a])||(shape[b]-shape[a]));
  const pct={};let sum=0;ORDER.forEach(k=>{pct[k]=Math.round(s[k]/total*100);sum+=pct[k];});
  pct[ranked[0]]+=100-sum;
  return {top:ranked[0],ranked,pct};
}

function result(){
  const {top,ranked,pct}=score();const t=T(top);
  const whyBox=w=>`<div class="whys">${w.map(x=>`<div class="why"><em>${u("my")}</em><b>“${esc(x.ans)}”</b><span>${x.ex}</span></div>`).join("")}</div>`;
  document.documentElement.style.setProperty("--c",t.color);
  app.innerHTML=`<div class="screen">
   <div class="hero gut"><div class="kick">MY SASANG TYPE</div>
    <div class="label"><div class="en">${TYPES[top].en}</div><div class="line">a key for your body &amp; mind</div><div class="step">#TYPE.${t.n}</div></div>
    <h2 class="name">${u("title")(t.ko)}</h2><div class="nick">${t.nick}</div><p class="rnote">${u("rnote")}</p></div>
   <div class="sec gut"><h3>MY SCORE</h3><div class="bars">${ranked.map(k=>`<div class="row ${k===top?"me":""}"><span>${T(k).ko}</span><div class="track"><i data-w="${pct[k]}" style="background:${k===top?TYPES[k].color:"#7a7a7c"}"></i></div><b>${pct[k]}%</b></div>`).join("")}</div></div>
   ${(()=>{const w=whyList(top);return w.length?`<div class="sec gut"><h3>WHY</h3><div class="wt">${u("whyT")(t.ko)}</div>${whyBox(w)}</div>`:""})()}
   <div class="sec gut"><h3>PERSONALITY</h3><ul>${t.traits.map(x=>`<li>${x}</li>`).join("")}</ul></div>
   <div class="sec gut"><h3>FOOD</h3><div class="sub first">${u("good")}</div><div class="chips">${t.good.map(x=>`<span class="chip">${x}</span>`).join("")}</div>
    <div class="sub">${u("bad")}</div><div class="chips">${t.bad.map(x=>`<span class="chip no">${x}</span>`).join("")}</div></div>
   <div class="sec gut"><h3>LIFE TIP</h3><ul>${t.tips.map(x=>`<li>${x}</li>`).join("")}</ul></div>
   ${(()=>{const s2=ranked[1],t2=T(s2);if(pct[s2]<20)return "";const w=whyList(s2,2);if(!w.length)return "";return `<div class="sec gut"><h3>ALSO POSSIBLE</h3><div class="wt">${u("alsoT")(t2.ko)}</div><p class="alsop">${u("alsoP")(t2.ko,pct[s2])}</p>${whyBox(w)}<p class="alsop" style="margin-top:12px">${u("alsoEnd")}</p></div>`;})()}
   <div class="btns gut"><button class="btn p" id="share">${u("share")}</button><button class="btn s" id="again">${u("again")}</button>
    <p class="note">${u("rfoot")}</p>
    <div class="code"><span>${u("code")}</span><code id="rcode">${lang}/${gender||"-"}/${dx||"-"}/${answers.map(a=>a+1).join("")}/${top}</code><button id="copycode">${u("copy")}</button></div></div></div>`;
  document.getElementById("copycode").onclick=async()=>{const c=document.getElementById("rcode").textContent;try{await navigator.clipboard.writeText(c);toast(u("copied"));}catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById("rcode"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast(u("hold"));}};
  window.scrollTo(0,0);
  requestAnimationFrame(()=>requestAnimationFrame(()=>app.querySelectorAll(".track i").forEach(i=>i.style.width=i.dataset.w+"%")));
  document.getElementById("again").onclick=()=>{window.scrollTo(0,0);start();};
  document.getElementById("share").onclick=async()=>{
    const text=u("shareText")(t.ko,t.nick);const url=location.href.split("#")[0]+(lang==="en"?"#en":"");
    try{if(navigator.share){await navigator.share({title:u("shareTitle"),text,url});return;}}catch(e){if(e&&e.name==="AbortError")return;}
    try{await navigator.clipboard.writeText(`${text} ${url}`);toast(u("linkCopied"));}catch(e){toast(u("linkFail"));}
  };
}
function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2000);}
start();
</script>
